# wirebond's system harness (SPEC §23.1 tier 3): the daemon as released, as client and anchor, in
# network namespaces, as root, with real TUN devices, nftables NAT, tc's tbf and netem; driven by
# crates/load. tests/system/run.sh does it all; each job builds what it runs, checks the daemon is
# static and stripped (for ci.yml too), and installs the tools.
# release.yml calls this workflow before it publishes.
name: system

on:
  # As in ci.yml: a branch's pushes are checked as its pull request, tags run release.yml, and a
  # change to the website alone runs site.yml only.
  push:
    branches: [main]
    paths-ignore: ['site/**', '.github/workflows/site.yml']
  pull_request:
    paths-ignore: ['site/**', '.github/workflows/site.yml']
  schedule:
    - cron: '41 10 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  RUST_VERSION: '1.99.1' # as in ci.yml

concurrency:
  # The prefix is literal: in a workflow_call github.workflow is the caller's name, and release.yml
  # calls ci.yml and system.yml at once. A run of this workflow itself supersedes the earlier one
  # for its ref. A run release.yml calls has a group of its own (the caller's run id): it has
  # release.yml's event and ref, so another run with those, a manual one of system.yml on main
  # among them, cancelled the release's job, and nothing was published.
  group: system-${{ github.event_name }}-${{ github.workflow == 'system' && github.ref || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    # Named, so that it is bash -eo pipefail: the default, bash -e, takes a pipeline's status from
    # its last command, and the harness below is piped into tee.
    shell: bash

jobs:
  # The harness's targets in two halves side by side, each on a runner of its own, so a run takes
  # the longer half's time, not both: each scenario makes and removes its own namespaces, so the
  # halves are independent, and on two machines neither can disturb the other's measurements.
  rust:
    name: rust ${{ matrix.part }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {part: functional, targets: net a7 a8 a9 a10}
          - {part: perf, targets: a12 shaped netem}
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup toolchain install "$RUST_VERSION" --profile minimal -t x86_64-unknown-linux-musl --no-self-update && rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@v2
      - name: The daemon as released (static, musl), the load tool; tc's netem and tbf, nftables, jq
        run: |
          mkdir -p "$RUNNER_TEMP/system" && echo "TMPDIR=$RUNNER_TEMP/system" >> "$GITHUB_ENV"
          cargo build --release -p wirebond --locked --target x86_64-unknown-linux-musl
          cargo build --release -p load --locked
          echo "WIREBOND_BIN=$PWD/target/x86_64-unknown-linux-musl/release/wirebond" >> "$GITHUB_ENV"
          echo "LOAD_BIN=$PWD/target/release/load" >> "$GITHUB_ENV"
          sudo apt-get update -qq
          sudo apt-get install -y -qq nftables jq
          sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)" || echo "no linux-modules-extra: netem may be skipped"
          sudo modprobe -a sch_netem sch_tbf tun || true
      # functional: the namespaces and the load tool with no daemon, then A7 to A10. perf: A12, and
      # the shaped and netem runs against the mesh-lane baseline.
      - name: run.sh ${{ matrix.targets }}
        env:
          TARGETS: ${{ matrix.targets }}
          # A12's budget is 25% of one core per daemon on the device (SPEC §23.3). A runner is a few
          # shared virtual cores, and the harness bills each daemon for the kernel's work along the
          # whole simulated path, so here the same check guards against a regression: runners
          # measured 51-53% (client) and 61-63% (anchor) in November 2026.
          WIREBOND_A12_CPU: '85'
        run: |
          # The tables go to the job's summary as well; the harness's status is the step's.
          {
            echo '```'
            code=0
            sudo env PATH="$PATH" TMPDIR="$TMPDIR" WIREBOND_BIN="$WIREBOND_BIN" LOAD_BIN="$LOAD_BIN" \
              WIREBOND_A12_CPU="$WIREBOND_A12_CPU" tests/system/run.sh $TARGETS || code=$?
            echo '```'
            exit "$code"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # After the harness, and whether it passed or not: a daemon that is not static still runs,
      # and what the harness measured of it is worth having beside this failure.
      - name: The daemon is static and stripped (SPEC §22.5)
        if: success() || failure()
        run: |
          echo "linux x86_64: $(stat -c %s "$WIREBOND_BIN") bytes"
          kind=$(file -b "$WIREBOND_BIN") && echo "$kind"
          grep -q 'static.*, stripped$' <<< "$kind" || { echo "not a static, stripped executable"; exit 1; }
      - if: failure()
        run: sudo chmod -R a+rX "$TMPDIR"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: system-${{ matrix.part }}
          path: ${{ runner.temp }}/system
