[workspace]
resolver = "3"
members = ["crates/core", "crates/wirebond", "crates/netsim", "crates/load"]

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/TristanCopley/wirebond"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false

[profile.bench]
inherits = "release"
debug = true
strip = false

# Debug builds for development and tests: line tables only (small target dirs), the workspace at
# opt-level 1 so netsim runs at a usable speed, and dependencies fully optimized so AES-GCM in
# tests runs at hardware speed.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false
